name: Version and publish print kit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: print-release-main
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact pushed commit and history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check release logic
        run: python3 -m unittest discover -s source/tests -v
      - name: Validate evidence and prepare the next version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 source/release.py prepare --event-sha "$GITHUB_SHA"
      - name: Tag, verify uploaded assets and publish
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 source/release.py publish
